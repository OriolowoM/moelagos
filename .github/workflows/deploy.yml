name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

# Prevent concurrent deployments to avoid race conditions on the FTP server
concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: Automated Build & Package
  # Runs in GitHub's Ubuntu runner, installs dependencies and compiles React
  # =========================================================================
  build:
    name: Build Frontend & Backend Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build

      - name: Package PHP Backend Endpoints
        run: |
          mkdir -p dist/api
          cp -r api/* dist/api/
          cp public/.htaccess dist/.htaccess || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 14

  # =========================================================================
  # JOB 2: Deploy to cPanel (Requires 1-Click Manual Approval)
  # The 'production' environment has "Required Reviewers" configured on GitHub
  # =========================================================================
  deploy:
    name: Deploy to cPanel (Production)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://moelagos.gov.ng

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      - name: Incremental Sync to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_SERVER }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || 21 }}
          protocol: ${{ secrets.CPANEL_PROTOCOL || 'ftp' }}
          local-dir: dist/
          server-dir: ${{ secrets.CPANEL_REMOTE_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
